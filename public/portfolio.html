<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <title>作品集</title>
  <link rel="stylesheet" href="/static/css/portfolio.css">
  <style>
    /* 骨架屏占位 */
    .work-card-skeleton {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .skeleton-video {
      aspect-ratio: 16 / 9;
      background: linear-gradient(90deg, #1a1a30 25%, #22223a 50%, #1a1a30 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    .skeleton-info {
      padding: 24px 28px;
    }
    .skeleton-title {
      height: 24px; width: 60%; border-radius: 4px;
      background: linear-gradient(90deg, #1a1a30 25%, #22223a 50%, #1a1a30 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      margin-bottom: 12px;
    }
    .skeleton-desc {
      height: 16px; width: 80%; border-radius: 4px;
      background: linear-gradient(90deg, #1a1a30 25%, #22223a 50%, #1a1a30 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    /* 视频封面占位 */
    .work-video-wrap {
      position: relative;
    }
    .video-placeholder {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #000;
      cursor: pointer;
      transition: background 0.3s;
    }
    .video-placeholder:hover {
      background: rgba(233, 69, 96, 0.08);
    }
    .video-placeholder .play-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(233, 69, 96, 0.85);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, background 0.2s;
    }
    .video-placeholder:hover .play-icon {
      transform: scale(1.1);
      background: rgba(233, 69, 96, 1);
    }
    .video-placeholder .play-icon svg {
      margin-left: 3px;
    }
    .video-placeholder .cover-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.6;
      transition: opacity 0.3s;
    }
    .video-placeholder:hover .cover-img {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <!-- 回到顶端按钮 -->
  <button id="scroll-to-top" title="回到顶端" onclick="scrollToTop()" style="display:none">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <path d="M18 15l-6-6-6 6"/>
    </svg>
  </button>

  <div id="app">
    <div id="loading" class="loading-screen">
      <div class="loading-animation">
        <div class="pulse-ring"></div>
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none">
          <path d="M16 14L36 24L16 34V14Z" fill="#e94560"/>
        </svg>
      </div>
      <p>正在加载作品集...</p>
    </div>

    <div id="portfolio" style="display:none">
      <nav class="nav">
        <div class="nav-brand">胡雪婷 · 作品集</div>
        <div class="badge-private">🔒 私密分享</div>
      </nav>

      <main class="main">
        <div class="hero-text">
          <h1>买量广告作品集</h1>
          <p class="hero-sub">跨媒体与动画艺术 · 数字化交互表达</p>
        </div>

        <!-- 分类标签栏 -->
        <div class="category-tabs">
          <button class="cat-tab active" data-cat="EN" onclick="switchCategory('EN')">
            <span class="cat-icon">🌍</span> 欧美EN
            <span class="cat-count" id="cat-count-EN">0</span>
          </button>
          <button class="cat-tab" data-cat="JP" onclick="switchCategory('JP')">
            <span class="cat-icon">🎌</span> 日本JP
            <span class="cat-count" id="cat-count-JP">0</span>
          </button>
          <button class="cat-tab" data-cat="CN" onclick="switchCategory('CN')">
            <span class="cat-icon">🇨🇳</span> 简中CN
            <span class="cat-count" id="cat-count-CN">0</span>
          </button>
          <button class="cat-tab" data-cat="KR" onclick="switchCategory('KR')">
            <span class="cat-icon">🇰🇷</span> 韩国KR
            <span class="cat-count" id="cat-count-KR">0</span>
          </button>
        </div>

        <div id="works-grid" class="works-grid"></div>
        <div id="empty-category" class="empty" style="display:none">该分类下暂无作品</div>
      </main>

      <footer class="footer">
        <p>此页面通过私密链接分享，仅供指定收件人查看</p>
      </footer>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const tokenParam = params.get('p') || params.get('s');
    const tokenKey = params.get('p') ? 'p' : 's';
    let currentCategory = 'EN';
    let allWorks = [];

    if (!tokenParam) {
      document.getElementById('loading').innerHTML = '<p>访问需要有效的分享链接</p>';
    } else {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('portfolio').style.display = 'block';

      const grid = document.getElementById('works-grid');
      grid.innerHTML = Array.from({length: 3}, () => `
        <div class="work-card-skeleton">
          <div class="skeleton-video"></div>
          <div class="skeleton-info">
            <div class="skeleton-title"></div>
            <div class="skeleton-desc"></div>
          </div>
        </div>
      `).join('');

      fetch(`/api/portfolio-data?${tokenKey}=${tokenParam}`)
        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(works => {
          allWorks = works;

          // 确保所有作品有 category 字段（兼容旧数据）
          allWorks.forEach(w => { if (!w.category) w.category = 'EN'; });

          // 计算各分类数量
          const catCounts = { EN: 0, JP: 0, CN: 0, KR: 0 };
          allWorks.forEach(w => {
            if (catCounts[w.category] !== undefined) catCounts[w.category]++;
          });
          Object.keys(catCounts).forEach(cat => {
            document.getElementById('cat-count-' + cat).textContent = catCounts[cat];
          });

          // 选择第一个有作品的分类
          const firstCat = ['EN', 'JP', 'CN', 'KR'].find(c => catCounts[c] > 0) || 'EN';
          switchCategory(firstCat);
        })
        .catch(() => {
          grid.innerHTML = `
            <div class="error-screen" style="padding:64px 0;text-align:center;">
              <svg width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" stroke="#e94560" stroke-width="2" fill="none"/><path d="M24 14V26M24 30V32" stroke="#e94560" stroke-width="3" stroke-linecap="round"/></svg>
              <p style="margin-top:16px;color:var(--text-muted);">分享链接无效或已失效</p>
              <p class="small" style="font-size:13px;color:var(--text-muted);">请联系创作者获取新的分享链接</p>
            </div>`;
        });
    }

    // ========== 分类切换 ==========
    function switchCategory(cat) {
      currentCategory = cat;

      // 更新 tab 状态
      document.querySelectorAll('.cat-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.cat === cat);
      });

      // 筛选作品
      const filtered = allWorks
        .filter(w => w.category === cat)
        .sort((a, b) => a.order - b.order);

      const grid = document.getElementById('works-grid');
      const empty = document.getElementById('empty-category');

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      // 优化 Cloudinary 封面/缩略图 URL
      function optimizeCoverUrl(url) {
        if (!url) return '';
        return url.replace(/\/upload\//, '/upload/w_800,q_auto,f_auto/');
      }
      function videoThumbnailUrl(videoUrl) {
        if (!videoUrl) return '';
        return videoUrl.replace(/\/upload\//, '/upload/so_auto,w_800,q_auto,f_auto/');
      }

      grid.innerHTML = filtered.map((w, i) => {
        const posterUrl = w.coverUrl ? optimizeCoverUrl(w.coverUrl) : videoThumbnailUrl(w.videoUrl);
        return `
        <div class="work-card" data-index="${i}">
          <div class="work-video-wrap">
            <video id="video-${i}" controls playsinline preload="none"
                   class="work-video"
                   data-src="${w.videoUrl || ''}"
                   poster="${posterUrl}">
            </video>
            <div class="video-placeholder" id="placeholder-${i}" onclick="playVideo(${i})">
              ${posterUrl ? `<img class="cover-img" src="${posterUrl}" alt="" loading="lazy">` : ''}
              <div class="play-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                  <path d="M8 5v14l11-7z"/>
                </svg>
              </div>
            </div>
          </div>
          <div class="work-info">
            <h2 class="work-title">${w.title}</h2>
            <p class="work-desc">${w.description || ''}</p>
          </div>
        </div>
      `}).join('');

      // 播放互斥
      const allVideos = document.querySelectorAll('.work-video');
      allVideos.forEach(video => {
        video.addEventListener('play', () => {
          allVideos.forEach(other => {
            if (other !== video && !other.paused) other.pause();
          });
        });
      });

      // 懒加载
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const video = entry.target;
            const src = video.dataset.src;
            if (src && !video.querySelector('source')) {
              const source = document.createElement('source');
              source.src = src;
              source.type = 'video/mp4';
              video.appendChild(source);
              video.load();
            }
            observer.unobserve(video);
          }
        });
      }, { rootMargin: '200px' });

      allVideos.forEach(video => observer.observe(video));
    }

    // 点击播放视频
    function playVideo(index) {
      const video = document.getElementById('video-' + index);
      const placeholder = document.getElementById('placeholder-' + index);
      if (!video) return;
      if (!video.querySelector('source')) {
        const src = video.dataset.src;
        if (src) {
          const source = document.createElement('source');
          source.src = src;
          source.type = 'video/mp4';
          video.appendChild(source);
          video.load();
        }
      }
      placeholder.style.display = 'none';
      video.play().catch(() => {});
    }

    // ========== 回到顶端 ==========
    const scrollTopBtn = document.getElementById('scroll-to-top');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 400) {
        scrollTopBtn.style.display = 'flex';
        scrollTopBtn.style.animation = 'fadeIn 0.3s ease';
      } else {
        scrollTopBtn.style.display = 'none';
      }
    });
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
