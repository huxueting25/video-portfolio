<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>作品集</title>
  <link rel="stylesheet" href="/static/css/portfolio.css">
</head>
<body>

<button id="scroll-to-top" title="回到顶端" onclick="scrollToTop()" style="display:none">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 15l-6-6-6 6"/></svg>
</button>

<nav class="top-nav">
  <div class="nav-brand">胡雪婷 · 作品集</div>
  <div class="badge-private">🔒 私密分享</div>
</nav>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-title">买量广告</div>
  <nav class="sidebar-nav">
    <a class="side-link active" href="#section-EN" data-cat="EN" onclick="scrollToCat('EN')">
      <span class="side-dot side-dot-EN"></span>欧美EN
      <span class="side-count" id="side-count-EN">0</span>
    </a>
    <a class="side-link" href="#section-JP" data-cat="JP" onclick="scrollToCat('JP')">
      <span class="side-dot side-dot-JP"></span>日本JP
      <span class="side-count" id="side-count-JP">0</span>
    </a>
    <a class="side-link" href="#section-CN" data-cat="CN" onclick="scrollToCat('CN')">
      <span class="side-dot side-dot-CN"></span>简中CN
      <span class="side-count" id="side-count-CN">0</span>
    </a>
    <a class="side-link" href="#section-KR" data-cat="KR" onclick="scrollToCat('KR')">
      <span class="side-dot side-dot-KR"></span>韩国KR
      <span class="side-count" id="side-count-KR">0</span>
    </a>
  </nav>
</aside>

<main class="main-content">
  <div class="hero-text">
    <h1>买量广告作品集</h1>
    <p class="hero-sub">跨媒体与动画艺术 · 数字化交互表达</p>
  </div>
  <div class="search-bar" id="search-bar" style="display:none">
    <div class="search-input-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" class="search-input" id="search-input" placeholder="搜索作品标题..." oninput="onSearch(this.value)">
      <button class="search-clear" id="search-clear" onclick="clearSearch()" style="display:none">✕</button>
    </div>
    <span class="search-result" id="search-result"></span>
  </div>
  <div id="category-sections"></div>
</main>

<footer class="footer"><p>此页面通过私密链接分享，仅供指定收件人查看</p></footer>

<div class="loading-overlay" id="loading-overlay">
  <div class="loading-animation"><div class="pulse-ring"></div><svg width="40" height="40" viewBox="0 0 48 48" fill="none"><path d="M16 14L36 24L16 34V14Z" fill="#e94560"/></svg></div>
  <p>正在加载作品集...</p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const tokenParam = params.get('p') || params.get('s');
const tokenKey = params.get('p') ? 'p' : 's';
let allWorks = [];
let searchQuery = '';
let vidCounter = 0;

const catConfig = {
  EN: { label: '欧美EN', icon: '🌍', color: '#4ecca3' },
  JP: { label: '日本JP', icon: '🎌', color: '#ff9800' },
  CN: { label: '简中CN', icon: '🇨🇳', color: '#e94560' },
  KR: { label: '韩国KR', icon: '🇰🇷', color: '#6495ed' }
};

// 每个分类独立折叠状态
const collapsed = { EN: false, JP: false, CN: true, KR: true };

function showErr(msg) {
  document.getElementById('loading-overlay').innerHTML = '<div style="text-align:center;padding-top:40vh;">'+msg+'</div>';
}

if (!tokenParam) {
  showErr('<p>访问需要有效的分享链接</p>');
} else {
  fetch('/api/portfolio-data?'+tokenKey+'='+tokenParam)
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(works => {
      allWorks = works;
      allWorks.forEach(w => { if (!w.category) w.category = 'EN'; });
      renderAll();
      document.getElementById('loading-overlay').style.display = 'none';
    })
    .catch(() => showErr('<p style="color:#e94560;">分享链接无效或已失效</p>'));
}

function posterUrl(w) {
  if (w.coverUrl) return w.coverUrl;
  if (!w.videoUrl) return '';
  return w.videoUrl.replace('/upload/','/upload/so_0,w_640/').replace('.mp4','.jpg');
}

function renderAll() {
  document.getElementById('search-bar').style.display = allWorks.length > 0 ? 'block' : 'none';
  const counts = { EN:0, JP:0, CN:0, KR:0 };
  allWorks.forEach(w => {
    const cat = w.category || 'EN';
    if ((!searchQuery || w.title.toLowerCase().includes(searchQuery)) && counts[cat]!==undefined) counts[cat]++;
  });
  document.getElementById('search-result').textContent = searchQuery ? '找到 '+Object.values(counts).reduce((a,b)=>a+b,0)+' 个结果' : '';
  ['EN','JP','CN','KR'].forEach(c => document.getElementById('side-count-'+c).textContent = counts[c]);

  const order = ['EN','JP','CN','KR'];
  let html = '';
  order.forEach(cat => {
    const cfg = catConfig[cat];
    const items = allWorks
      .filter(w => (w.category||'EN')===cat)
      .filter(w => !searchQuery || w.title.toLowerCase().includes(searchQuery))
      .sort((a,b)=>a.order-b.order);
    const isCollapsed = collapsed[cat];

    html += '<section class="cat-section" id="section-'+cat+'" data-cat="'+cat+'">';
    html += '<div class="section-header" onclick="toggleCat(\''+cat+'\')">';
    html += '<div class="section-header-left"><span class="section-icon">'+cfg.icon+'</span><h2 class="section-label">'+cfg.label+'</h2><span class="section-count">'+items.length+' 个作品</span></div>';
    html += '<div class="section-toggle'+(isCollapsed?' collapsed':'')+'" id="toggle-'+cat+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></div>';
    html += '</div>';
    html += '<div class="section-body'+(isCollapsed?' collapsed':'')+'" id="body-'+cat+'">';
    if (items.length===0) {
      html += '<p class="section-empty">暂无作品</p>';
    } else {
      html += items.map(w => {
        const idx = vidCounter++;
        const pUrl = posterUrl(w);
        return '<div class="work-card"><div class="work-video-wrap">'
        +'<video id="video-'+idx+'" controls playsinline preload="none" class="work-video" data-src="'+ (w.videoUrl||'') +'" poster="'+pUrl+'"></video>'
        +'<div class="video-placeholder" id="placeholder-'+idx+'" onclick="playVideo('+idx+')">'
        +(pUrl?'<img class="cover-img" src="'+pUrl+'" alt="" loading="lazy">':'')
        +'<div class="play-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></div></div></div>'
        +'<div class="work-info"><h3 class="work-title">'+w.title+'</h3>'+(w.description?'<p class="work-desc">'+w.description+'</p>':'')+'</div></div>';
      }).join('');
    }
    html += '</div></section>';
  });

  document.getElementById('category-sections').innerHTML = html;
  setupObservers();
}

function setupObservers() {
  const allVideos = document.querySelectorAll('.work-video');
  allVideos.forEach(v => v.addEventListener('play', () => {
    allVideos.forEach(o => { if (o !== v && !o.paused) o.pause(); });
  }));
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const v = e.target;
        if (v.dataset.src && !v.querySelector('source')) {
          const s = document.createElement('source'); s.src = v.dataset.src; s.type = 'video/mp4';
          v.appendChild(s); v.load();
        }
        obs.unobserve(v);
      }
    });
  }, { rootMargin: '200px' });
  allVideos.forEach(v => obs.observe(v));
}

function playVideo(idx) {
  const v = document.getElementById('video-'+idx);
  const p = document.getElementById('placeholder-'+idx);
  if (!v) return;
  if (!v.querySelector('source') && v.dataset.src) {
    const s = document.createElement('source'); s.src = v.dataset.src; s.type = 'video/mp4';
    v.appendChild(s); v.load();
  }
  p.style.display = 'none';
  v.play().catch(()=>{});
}

function toggleCat(cat) {
  if (!collapsed[cat]) {
    // 当前展开 → 折叠它
    collapsed[cat] = true;
    document.getElementById('body-'+cat).classList.add('collapsed');
    document.getElementById('toggle-'+cat).classList.add('collapsed');
  } else {
    // 当前折叠 → 展开它，折叠其他
    ['EN','JP','CN','KR'].forEach(c => {
      collapsed[c] = (c !== cat);
      ['body-','toggle-'].forEach(p => {
        const el = document.getElementById(p+c);
        if (el) el.classList.toggle('collapsed', c !== cat);
      });
    });
  }
}

function scrollToCat(cat) {
  ['EN','JP','CN','KR'].forEach(c => {
    collapsed[c] = (c !== cat);
    ['body-','toggle-'].forEach(p => {
      const el = document.getElementById(p+c);
      if (el) el.classList.toggle('collapsed', c !== cat);
    });
  });
  const sec = document.getElementById('section-'+cat);
  if (sec) {
    const h = document.querySelector('.top-nav').offsetHeight;
    window.scrollTo({ top: sec.getBoundingClientRect().top + window.scrollY - h - 16, behavior: 'smooth' });
  }
  document.querySelectorAll('.side-link').forEach(l => l.classList.toggle('active', l.dataset.cat===cat));
}

// 滚动高亮
let sd;
window.addEventListener('scroll', () => {
  clearTimeout(sd);
  sd = setTimeout(() => {
    const secs = document.querySelectorAll('.cat-section');
    const hh = document.querySelector('.top-nav').offsetHeight;
    let cur = 'EN';
    secs.forEach(s => { if (s.getBoundingClientRect().top <= hh+100) cur = s.dataset.cat; });
    document.querySelectorAll('.side-link').forEach(l => l.classList.toggle('active', l.dataset.cat===cur));
  }, 100);
});

function onSearch(q) {
  document.getElementById('search-clear').style.display = q ? 'flex' : 'none';
  searchQuery = q.trim().toLowerCase();
  vidCounter = 0;
  renderAll();
}
function clearSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').style.display = 'none';
  searchQuery = '';
  vidCounter = 0;
  renderAll();
}

// 回到顶端
const stb = document.getElementById('scroll-to-top');
window.addEventListener('scroll', () => { stb.style.display = window.scrollY > 400 ? 'flex' : 'none'; });
function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
</script>
</body>
</html>
